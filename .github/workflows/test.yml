# CI for oc-go-usage-display.
#
# Triggers: push + pull_request + weekly schedule (Mondays 06:00 UTC).
#
# Jobs:
#   - unit          : typecheck + build + READONLY unit tests on Node 22. The
#                     live usage shape check lives in test/unit/live-usage.test.js
#                     and runs when OPENCODE_GO_API_KEY is available (skips
#                     neutrally otherwise). Unit tests never write to the host.
#   - container-e2e : the authoritative gate. Builds the root Dockerfile and
#                     runs the full containerized suite (integration + e2e,
#                     including the real opencode/kilo TUI display checks via
#                     tmux). Hermetic: all HOME/XDG/opencode paths and tmux
#                     sockets live in container/tmp dirs. OPENCODE_GO_API_KEY is
#                     forwarded when present; the live variants skip otherwise.
#
# Startup-safety rule: the secrets context must NOT appear in any conditional
# expression (job-level or step-level). Each job maps the secret once via
# job-level `env:`.
#
# Concurrency: one run per ref; a new push cancels the previous in-flight run.

name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (typecheck + build + readonly tests)
    runs-on: ubuntu-slim
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run check

      - name: Test (build + unit)
        run: bun run test

  container-e2e:
    name: container-e2e (docker compose)
    # ubuntu-latest on purpose: the slim runner image has no Docker daemon.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run containerized test gate
        # Builds the root Dockerfile and runs the checkout baked into the
        # image: opencode --version && kilo --version && bun install && bun
        # run build && bun run test:integration && bun run test:e2e. No bind
        # mount, so the gate is independent of the runner UID. compose.yml
        # forwards OPENCODE_GO_API_KEY from this job env. `docker compose run`
        # propagates the command's exit code.
        run: docker compose run --rm --build test
