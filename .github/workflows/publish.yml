# Publish oc-go-usage-display to npm via trusted publishing (OIDC).
#
# No long-lived npm token: the publish job authenticates with the short-lived
# OIDC token minted for trusted publishing, so it intentionally sets no npm
# auth token env var.
#
# Trigger: push to `main` only.
#
# Flow (release-please):
#   test           - authoritative containerized gate, rebuilt + retested on the
#                    exact ref being released.
#   release-please - parses Conventional Commits and maintains a Release PR
#                    (`chore(main): release X.Y.Z`, generated CHANGELOG.md +
#                    package.json bump). Only feat/fix/breaking (and the visible
#                    deps/revert sections) open one; chore/docs/ci/test/refactor/
#                    style/build/perf are hidden changelog sections and cannot
#                    trigger a release on their own. Force a version with a
#                    `Release-As: X.Y.Z` footer on a commit merged to `main`.
#   publish        - runs only when a Release PR was just merged. release-please
#                    has already created the tag + GitHub release (with the
#                    default GITHUB_TOKEN, which does not trigger another
#                    workflow run), so this job verifies the packed tarball
#                    ships BOTH hosts (opencode + kilo bundles), attaches the
#                    tarball, the four plugin bundles and SHA256SUMS to the
#                    release, and publishes. The npm step skips idempotently
#                    when the version already exists; after publishing (or
#                    skipping) the registry tarball is re-verified. Recovery is
#                    GitHub's "Re-run failed jobs" on the same run.
#
# Repo setting: "Allow GitHub Actions to create and approve pull requests" must
# be enabled for release-please to open its PR.
#
# NOTE: never add `[skip ci]` to release commits — it would suppress this run
# and the release would be tagged but never published.

name: publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  test:
    name: test gate (must pass before release)
    # ubuntu-latest on purpose: the slim runner image has no Docker daemon.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run containerized test gate
        # Rebuilds and retests the exact ref inside the pinned image
        # (integration + e2e, incl. the real opencode/kilo TUI display checks
        # via tmux). Same authoritative gate as test.yml container-e2e. The
        # publish job installs its own Node/npm for publishing below.
        run: docker compose run --rm --build test

  release-please:
    name: release-please (maintains the Release PR)
    needs: [test]
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update or open the Release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish to npm (OIDC trusted publishing)
    needs: [test, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    # ubuntu-latest: needs the gh CLI and full Node/npm tooling.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout (release tag)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: Setup Node 24 with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # OIDC trusted publishing needs no static auth.
          always-auth: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # No package-lock.json (bun.lock is the lockfile), so `npm ci` cannot work.
        run: bun install

      - name: Build
        run: bun run build

      - name: Pack, verify, attach to release, publish to npm
        # One package/version carries all four bundles; the tarball contract is
        # verified before anything is uploaded and again against the registry
        # copy after publish, so a Kilo-less release can never ship silently.
        # Idempotent re-runs: the npm step skips a version that is already
        # published (retried runs, or a release tag that was pushed twice).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-please.outputs.tag_name }}"
          mkdir -p "$RUNNER_TEMP/npm-tarball"
          rm -f "$RUNNER_TEMP/npm-tarball/"*.tgz
          # npm pack here on purpose: the release asset mirrors the tarball
          # `npm publish` will build for the registry below.
          npm pack --pack-destination "$RUNNER_TEMP/npm-tarball/"
          TARBALL="$(ls "$RUNNER_TEMP/npm-tarball/"*.tgz)"
          node scripts/verify-tarball.mjs "$TARBALL"
          (
            cd dist/plugins
            sha256sum oc-go-usage-display.ts oc-go-usage-display.tsx \
              oc-go-usage-display.kilo.ts oc-go-usage-display.kilo.tsx
          ) > "$RUNNER_TEMP/SHA256SUMS"
          ( cd "$RUNNER_TEMP/npm-tarball" && sha256sum *.tgz ) >> "$RUNNER_TEMP/SHA256SUMS"
          gh release upload "$TAG" "$TARBALL" \
            dist/plugins/oc-go-usage-display.ts \
            dist/plugins/oc-go-usage-display.tsx \
            dist/plugins/oc-go-usage-display.kilo.ts \
            dist/plugins/oc-go-usage-display.kilo.tsx \
            "$RUNNER_TEMP/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --clobber
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VER is already on npm — skipping publish (idempotent re-run)."
          else
            npm publish --provenance --access public
          fi
          # npm versions are immutable, so this proves (rather than repairs)
          # that the registry copy ships both hosts.
          URL="$(npm view "$NAME@$VER" dist.tarball)"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/published.tgz"
          node scripts/verify-tarball.mjs "$RUNNER_TEMP/published.tgz"
